<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زكي المطور | النسخة الحديثة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #38bdf8;
            --text: #f1f5f9;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 { color: var(--accent); text-align: center; font-size: 1.8rem; }
        
        .status-badge {
            background: #10b981;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 10px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        input[type="checkbox"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: var(--bg);
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover { opacity: 0.9; transform: scale(0.98); }

        footer { text-align: center; font-size: 0.8rem; opacity: 0.5; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="container">
        <header class="glass-card">
            <div class="status-badge">وضع التطوير: نشط 🚀</div>
            <h1>مرحباً، أنا زكي المطور</h1>
            <p style="text-align: center; opacity: 0.8;">"النسخة الحديثة - بناء وتطوير"</p>
        </header>

        <section class="glass-card">
            <h3>✅ مهام التركيز اليومي</h3>
            <div class="task-item">
                <input type="checkbox" id="t1">
                <label for="t1">روتين الصباح (بدون شاشات)</label>
            </div>
            <div class="task-item">
                <input type="checkbox" id="t2">
                <label for="t2">90 دقيقة عمل عميق (برمجة)</label>
            </div>
            <div class="task-item">
                <input type="checkbox" id="t3">
                <label for="t3">مراجعة الأهداف والتعلم</label>
            </div>
        </section>

        <section class="glass-card">
            <h3>🔗 روابط سريعة</h3>
            <a href="#" class="btn">معرض مشاريعي</a>
            <a href="https://github.com" class="btn" style="background: #475569; color: white;">بروفايل GitHub</a>
        </section>

        <footer>
            تم التطوير بواسطة زكي عبر Termux <br> 2026 &copy;
        </footer>
    </div>

</body>
</html>
